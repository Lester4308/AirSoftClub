<!doctype html>
<html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airsoft Club — персонаж</title>
<style>*{box-sizing:border-box}body{margin:0;background:#151b19;color:#eee9dd;font:16px/1.6 system-ui}main{max-width:1180px;margin:auto;padding:24px;display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);gap:40px;align-items:center}figure{margin:0;background:#b4afa5;border-radius:12px;overflow:hidden}img{display:block;width:100%;max-height:88vh;object-fit:contain}small{color:#b9b196;letter-spacing:.15em}h1{font-size:36px;line-height:1.2}p{color:#bdc4ba}a,button{display:inline-block;color:#efe9da;background:#343f33;border:1px solid #718062;border-radius:6px;padding:10px 16px;text-decoration:none;font:inherit;margin:6px 6px 6px 0;cursor:pointer}button[aria-pressed=true]{background:#5d694d}a:focus-visible,button:focus-visible{outline:3px solid #e7bf75}footer{margin-top:28px;font-size:13px;color:#a0aa9d}@media(max-width:700px){main{grid-template-columns:1fr;gap:12px}h1{font-size:28px}img{max-height:72vh}}</style>
<main><figure id="stage"><img id="character" src="assets/male-finished-studio.png" alt="Цілісний low-poly боєць у камуфляжі, бронежилеті, шоломі та захисній масці, з опущеною зброєю. Без кобури й видимих кишень на рукавах."></figure><section><small>AIRSOFT CLUB</small><h1>Готовий образ бійця</h1><p>М’який low-poly, оливковий камуфляж і піщане спорядження. Єдина поза та узгоджена посадка всіх деталей.</p><div><button id="studio" aria-pressed="true">Студія</button><button id="dark" aria-pressed="false">Темний фон</button><button id="light" aria-pressed="false">Світлий фон</button></div><p><a href="assets/male-finished-studio.png" download>Завантажити ілюстрацію</a><a href="assets/male-finished-cutout.png" download>PNG без фону</a></p><footer>1024 × 1536 · статичний арт персонажа</footer></section></main>
<script>const img=document.querySelector('#character'),stage=document.querySelector('#stage');for(const id of ['studio','dark','light'])document.getElementById(id).onclick=()=>{img.src=id==='studio'?'assets/male-finished-studio.png':'assets/male-finished-cutout.png';stage.style.background=id==='dark'?'#252e2b':'#b4afa5';for(const b of document.querySelectorAll('button'))b.setAttribute('aria-pressed',String(b.id===id));};</script></html>
