name: airsoft-club-development
services:
  db:
    image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_DB: airsoft_club_dev
      POSTGRES_USER: airsoft_dev
      POSTGRES_PASSWORD: ${AIRSOFT_DB_PASSWORD:?Set AIRSOFT_DB_PASSWORD}
    volumes:
      - club-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airsoft_dev -d airsoft_club_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  club-data:
