emplate-columns:repeat(3,1fr);gap:14px;margin-top:15px}.card{background:var(--panel);border:1px solid #45534f;padding:17px;min-height:120px;position:relative}.card label{font:700 10px Consolas;color:var(--muted);letter-spacing:1.4px}.card strong{display:block;font:700 25px Consolas;margin:14px 0 6px}.card small{color:var(--sub)}.card.ready strong{color:var(--green)}.card.progress strong{color:var(--cyan)}.card.warning strong{color:var(--amber)}.cta-note{position:absolute;right:17px;top:17px;font:700 10px Consolas;padding:5px 7px;background:#18362a;color:var(--green)}

/* battle */.battle-layout{display:grid;grid-template-columns:220px 1fr 220px;gap:14px;height:710px}.squad{background:var(--section);border:1px solid #45524e;padding:14px}.squad h3{font:800 13px Consolas;color:var(--cyan)}.squad.enemy h3{color:var(--red)}.unit{height:55px;background:#232d2c;margin:7px 0;padding:9px;border-left:4px solid var(--cyan)}.enemy .unit{border-left-color:var(--red)}.unit b{font-size:12px}.hp{height:6px;background:#101615;margin-top:7px}.hp i{display:block;height:100%;width:76%;background:var(--green)}.arena{position:relative;background:#252c26;border:1px solid #59635a;overflow:hidden}.arena:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#49c8d815,transparent 35% 65%,#ff625b15),repeating-linear-gradient(0deg,transparent 0 114px,#6d796f30 115px 116px)}.cover{position:absolute;width:115px;height:70px;background:#705a3f;clip-path:polygon(5% 9%,94% 0,100% 86%,9% 100%)}.cover.c1{left:26%;top:31%}.cover.c2{right:27%;bottom:25%}.mini{position:absolute;width:62px;height:126px}.mini svg{width:100%;height:100%}.friendly{left:12%;top:28%}.friendly.f2{left:21%;top:58%}.hostile{right:12%;top:24%;transform:scaleX(-1)}.hostile.f2{right:22%;top:62%;transform:scaleX(-1)}.bbtrail{position:absolute;left:28%;top:43%;width:41%;height:3px;background:linear-gradient(90deg,transparent,var(--amber),transparent);transform:rotate(-5deg);box-shadow:0 0 8px var(--amber)}.score{position:absolute;top:15px;left:50%;transform:translateX(-50%);padding:10px 18px;background:#101615e8;border:1px solid #65716a;font:700 18px Consolas}.feed{position:absolute;left:15px;bottom:15px;width:380px;background:#101615df;padding:12px;font:12px Consolas;color:#cbd3cf;line-height:1.7}.legend{padding:11px;background:#3a301a;color:var(--amber);font-size:12px;margin-top:12px}
.caption{padding:14px 22px;background:#0b1012;border-top:1px solid #344248;color:#b3bdb9;font-size:13px}.caption b{color:#fff}@media(max-width:1650px){.frame{transform:scale(calc((100vw)/1600));height:calc(900px * (100vw/1600))}.caption{margin-top:0}}
</style></head><body>
<div class="topnav"><b>INDUSTRIAL CLUBHOUSE / REFINED</b><button class="on" data-view="hub">CLUB HUB</button><button data-view="characters">MALE + FEMALE</button><button data-view="arsenal">WEAPON SYSTEM</button><button data-view="battle">BATTLE</button></div>

<script>
const nav=`<aside class="rail"><div class="brand">AIRSOFT<br>CLUBHOUSE<small>IRON JACKALS / BAY 04</small></div>${['CLUB','ROSTER','RECRUITMENT','TRAINING','ARMORY','AMMUNITION','OPPONENTS','HISTORY'].map((x,i)=>`<div class="navitem ${i==0?'on':''}">${x}</div>`).join('')}<div class="rail-foot">LOCAL ART DIRECTION 014</div></aside>`;
const header=`<header class="header"><div class="club">IRON JACKALS<span>LEVEL 8 · RATING 1,284 · 12 READY</span></div><div class="res money"><label>MONEY</label><strong>12,460</strong></div><div class="res credit"><label>CREDITS</label><strong>84</strong></div><div class="res bb"><label>ACTIVE BB</label><strong>ADVANCED · 740</strong></div></header>`;
function frame(content){return `<div class="frame">${nav}<section class="main">${header}${content}</section></div>`}

function miniPerson(cls){return `<div class="mini ${cls}">${personSVG(false)}</div>`}
document.getElementById('hub').innerHTML=frame(`<div class="page"><div class="hero"><div class="warehouse"></div><div class="crate"></div><div class="hero-copy"><div class="eyebrow">WAREHOUSE HQ / CLUB BAY 04</div><h2>BUILD A CREW.<br>MAKE A NAME.</h2><p>Матеріальний клубний простір із чіткими інформаційними шарами. Фон залишається нейтральним; помаранчевий веде до головної дії, cyan — до інформації та вибору.</p><button class="btn primary">ЗНАЙТИ БІЙ</button><button class="btn info">ПЕРЕВІРИТИ СКЛАД</button></div></div><div class="cards"><div class="card ready"><label>TEAM READINESS</label><strong>12 / 14 READY</strong><small>2 бійці відновлюються</small><span class="cta-note">READY</span></div><div class="card progress"><label>CLUB PROGRESSION</label><strong>6,420 / 8,000</strong><small>До рівня клубу 9</small></div><div class="card warning"><label>SUPPLY STATUS</label><strong>▲ BB LOW SOON</strong><small>740 / 1,200 Advanced BB</small></div></div></div>`)+`<div class="caption"><b>Контраст:</b> помаранчевий — тільки основна дія; cyan — інформація/вибір; зелений — готовність; amber — попередження; Credits мають окремий фіолетовий канал.</div>`;
document.getElementById('characters').innerHTML=frame(`<div class="page"><div class="custom-grid"><aside class="categories"><h3>КАСТОМІЗАЦІЯ</h3><div class="option on">BODY FAMILY</div><div class="option">SKIN / FACE</div><div class="option">HAIR / CAP</div><div class="option">UNIFORM</div><div class="option" data-toggle="camo">CAMOUFLAGE</div><div class="option" data-toggle="helmet">HEAD PROTECTION</div><div class="option" data-toggle="armor">ARMOR / RIG</div><div class="option">CLUB PATCH</div><div class="locked">Механічні слоти спорядження не змішуються з косметикою.</div></aside><section class="stage"><div class="stage-floor"></div><div class="person-wrap male"><div class="person-name">M / UNIVERSAL BASE</div><div class="person male armor helmet">${personSVG(false)}</div></div><div class="person-wrap female"><div class="person-name">F / UNIVERSAL BASE</div><div class="person female armor helmet">${personSVG(true)}</div></div></section><aside class="inspector"><h3>APPEARANCE CONTRACT</h3><div class="swatches"><i class="sw on" style="background:#8b7153"></i><i class="sw" style="background:#b69272"></i><i class="sw" style="background:#d0aa87"></i><i class="sw" style="background:#694b38"></i></div><div class="slot"><b>BODY</b><span>Male / Female · shared rig</span></div><div class="slot"><b>CAMOUFLAGE</b><span>Independent uniform material</span></div><div class="slot"><b>HEAD PROTECTION</b><span>Helmet + mask on head socket</span></div><div class="slot"><b>LOAD-BEARING / ARMOR</b><span>Body-specific fit, shared ID</span></div><div class="slot"><b>WEAPON</b><span>Grip + support + muzzle anchors</span></div><button class="btn primary" style="width:100%;margin-top:17px">ЗБЕРЕГТИ ВИГЛЯД</button></aside></div></div>`)+`<div class="caption"><b>Male + Female:</b> дві геометричні бази одного рига; однакові назви кісток і sockets, окремі body-specific куртки/броня, спільні жорсткі аксесуари. Натисни CAMOUFLAGE / HEAD / ARMOR.</div>`;
const guns={Pistol:'M40 42 L120 40 127 53 92 57 83 93 60 91 65 56 40 55 Z',SMG:'M25 45 L74 38 88 45 185 43 211 52 205 62 110 62 96 98 76 95 80 63 30 74 19 67 Z',Assault:'M18 52 L67 39 91 47 205 43 233 52 330 51 330 62 224 65 197 75 103 70 76 100 55 96 61 69 20 81 Z',Shotgun:'M18 53 L77 45 100 51 340 51 340 61 105 68 68 93 46 91 53 68 20 79 Z',DMR:'M18 52 L69 42 101 50 240 45 270 52 365 51 365 61 259 65 222 73 105 69 78 101 55 97 62 68 20 80 Z',Sniper:'M12 53 L65 42 96 50 245 46 273 52 390 51 390 60 267 64 220 72 103 69 77 101 53 97 61 67 15 80 Z'};
let gunCards=Object.entries(guns).map(([n,p],i)=>`<div class="weapon-card ${i==2?'on':''}"><div class="family">${['SIDEARM','CQB','GENERAL','BREACH','MARKSMAN','LONG RANGE'][i]}</div><h3>${n.toUpperCase()}</h3><div class="gun"><svg viewBox="0 0 410 120"><path class="gbody" d="${p}"/><path class="gshade" d="M80 48 L210 47 220 58 92 65Z"/><rect class="gaccent" x="185" y="49" width="24" height="6"/></svg></div><footer><span>MK1 / MK2 / MK3</span><span>ANCHORS ✓</span></footer></div>`).join('');
document.getElementById('arsenal').innerHTML=frame(`<div class="page"><div class="arsenal"><section class="weapon-grid">${gunCards}</section><aside class="weapon-detail"><div class="eyebrow">ASSAULT RIFLE / MODEL FALCON</div><h2>TRUTHFUL FAMILY SILHOUETTE</h2><div class="mk-tabs"><button class="mk">MK1</button><button class="mk on">MK2</button><button class="mk">MK3</button></div><div class="comparison">MK-рівень змінює матеріали, фаски й малий accent — але не вдає неіснуючі attachments.</div><div class="anchor-list">● GripPrimary<br>● GripSupport<br>● StockContact<br>● Muzzle + Direction<br>○ MagazineCenter<br>○ OpticRail</div><button class="btn primary" style="width:100%;margin-top:19px">ПРИДБАТИ ЗА MONEY</button><button class="btn info" style="width:100%;margin-top:9px">ПЕРЕГЛЯНУТИ НА БІЙЦІ</button></aside></div></div>`)+`<div class="caption"><b>Weapon future-proofing:</b> 6 сімейств читаються чорним силуетом; усі мають однаковий anchor-contract і Detail/Icon/Combat LOD. MK3 не імітує suppressor, scope або magazine як механіку.</div>`;
document.getElementById('battle').innerHTML=frame(`<div class="page"><div class="battle-layout"><aside class="squad"><h3>◀ IRON JACKALS</h3>${['FOX · 84 HP','MICA · 61 HP','RUNE · OUT','KILO · 92 HP'].map(x=>`<div class="unit"><b>${x}</b><div class="hp"><i></i></div></div>`).join('')}</aside><section class="arena"><div class="score">12 · 08 &nbsp; / &nbsp; 06:42</div><div class="cover c1"></div><div class="cover c2"></div>${miniPerson('friendly')}${miniPerson('friendly f2')}${miniPerson('hostile')}${miniPerson('hostile f2')}<div class="bbtrail"></div><div class="feed">06:41  FOX → hit 18<br>06:40  MICA → armor impact<br>06:39  RUNE / OUT<br>06:38  ADVANCED BB · 92 remaining</div></section><aside class="squad enemy"><h3>RED WOLVES ▶</h3>${['VIPER · 46 HP','ASH · 74 HP','BOLT · 21 HP','ZERO · OUT'].map(x=>`<div class="unit"><b>${x}</b><div class="hp"><i style="background:var(--red);width:54%"></i></div></div>`).join('')}<div class="legend">▲ BB LOW · 92 LEFT</div></aside></div></div>`)+`<div class="caption"><b>Battle readability:</b> side + direction + marker shape duplicate team color. Low-poly silhouettes remain readable; cosmetics disappear by LOD before weapon, armor and team identity.</div>`;
document.querySelectorAll('.topnav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.topnav button,.view').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById(b.dataset.view).classList.add('on')});document.addEventListener('click',e=>{let o=e.target.closest('[data-toggle]');if(!o)return;o.classList.toggle('on');document.querySelectorAll('.person').forEach(p=>p.classList.toggle(o.dataset.toggle));});
</script></body></html>
