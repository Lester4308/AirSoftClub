<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Airsoft Club — Visual Directions</title>
<style>
:root{--ink:#eef3ef;--muted:#9aa7a4;--line:#34454c;--gold:#d7b168;--orange:#d98039;--blue:#68afc7;--bg:#090e12;font-family:Segoe UI,Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:#080c10;color:var(--ink)}button{font:inherit}.switcher{position:sticky;top:0;z-index:20;display:flex;gap:8px;padding:12px 18px;background:#080c10ee;border-bottom:1px solid #29343a}.switcher button{border:1px solid #3a4950;background:#141c21;color:#bec8c5;padding:10px 17px;cursor:pointer}.switcher button.active{color:#0c1114;background:var(--gold);border-color:var(--gold)}.concept{display:none;min-height:900px}.concept.active{display:block}.screen{height:820px;display:grid;grid-template-columns:190px 1fr;overflow:hidden}.nav{padding:26px 16px;border-right:1px solid var(--line);position:relative}.logo{font-weight:900;letter-spacing:3px;font-size:23px;line-height:.92;margin:0 10px 38px}.nav a{display:block;padding:12px 15px;margin:6px 0;color:inherit;text-decoration:none;font-size:13px;letter-spacing:.7px}.nav a.on{font-weight:800}.nav small{position:absolute;bottom:20px;left:24px;color:var(--muted)}main{position:relative;padding:0 28px 28px;overflow:hidden}.top{height:76px;display:flex;align-items:center;border-bottom:1px solid var(--line);gap:18px}.clubname{font-size:21px;font-weight:800;flex:1}.chip{padding:10px 15px;border:1px solid var(--line);font-size:12px}.chip b{display:block;font-size:17px;margin-top:2px}.content{padding-top:24px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:800}.title{font-size:42px;line-height:1;margin:8px 0 13px;max-width:650px}.lead{color:var(--muted);max-width:620px;line-height:1.5}.hero{height:290px;position:relative;padding:34px;overflow:hidden}.fighter{position:absolute;right:50px;bottom:-70px;height:390px;filter:drop-shadow(0 18px 20px #0009)}.action{border:0;padding:13px 22px;font-weight:900;margin-top:22px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-top:16px}.card{padding:18px;min-height:118px;border:1px solid var(--line)}.card label{display:block;color:var(--muted);font-size:11px;letter-spacing:1.3px}.card strong{display:block;font-size:25px;margin-top:15px}.bottom{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:15px}.bottom .card{height:145px}.micro{font-size:12px;color:var(--muted);margin-top:8px}.palette{position:absolute;right:25px;bottom:22px;display:flex;gap:7px}.palette i{width:18px;height:18px;border:1px solid #fff3}.tag{position:absolute;right:24px;top:96px;font:700 11px Consolas,monospace;letter-spacing:1px;padding:8px 11px}.desc{padding:16px 24px;border-top:1px solid #263138;color:#b6c0be;font-size:14px}.desc b{color:#fff}
/* A tactical */#a{--line:#2c424b;background:#0b1218}.a .nav{background:#101b22}.a .logo,.a .eyebrow,.a .card strong{color:#e2b966}.a .nav a.on{background:#233641;border-left:3px solid #e2b966}.a .top{background:#111c23}.a .hero{background:linear-gradient(90deg,#15242d 0 56%,#24383d 100%);border:1px solid #344b53}.a .hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 74px,#ffffff08 75px 76px)}.a .action{background:#d8893e;color:#101519}.a .card{background:#15222a}.a .tag{border:1px solid #6db5cb;color:#6db5cb}
/* B industrial */#b{--line:#534b3e;background:#171612}.b .nav{background:#23221b}.b .logo,.b .eyebrow,.b .card strong{color:#e1bd78}.b .nav a.on{background:#3d392b;color:#ffd58a}.b .top{background:#211f19}.b .hero{background:linear-gradient(90deg,#2c2a20 0 53%,#464839 100%);border:1px solid #615d48}.b .hero:after{content:"CQB • BAY 04";position:absolute;right:38px;top:31px;color:#d5c9a9;font:700 11px Consolas;letter-spacing:2px}.b .action{background:#c46f30;color:#171410}.b .card{background:#29271f;box-shadow:inset 0 3px #77715a}.b .tag{background:#d5b26f;color:#252117}.b .fighter{filter:sepia(.18) drop-shadow(0 18px 20px #000b)}
/* C social */#c{--line:#414657;background:#11121a}.c .nav{background:#171826}.c .logo{color:#f6f1e7}.c .eyebrow,.c .card strong{color:#ffd05b}.c .nav a.on{background:#e9b949;color:#19151c}.c .top{background:#191a26}.c .hero{background:linear-gradient(115deg,#24273a 0 49%,#3c3754 100%);border:1px solid #504e67}.c .hero:before{content:"RANKED SEASON 01";position:absolute;right:32px;top:30px;background:#e95353;color:#fff;padding:7px 12px;font-size:10px;font-weight:900;letter-spacing:1px}.c .action{background:#f0bd45;color:#20170e;border-radius:4px}.c .card{background:#202232;border-radius:5px}.c .chip{border-radius:4px}.c .tag{background:#5a65df;color:#fff;border-radius:4px}
@media(max-width:900px){.screen{transform-origin:top left;transform:scale(.68);width:147%;height:820px}.concept{min-height:620px}}
</style></head><body>
<div class="switcher"><button class="active" data-id="a">A — Tactical Command</button><button data-id="b">B — Industrial Clubhouse</button><button data-id="c">C — Modern Social Rivalry</button></div>
<div id="a" class="concept a active"></div><div id="b" class="concept b"></div><div id="c" class="concept c"></div>
<script>
const data={a:{logo:'AIRSOFT<br>COMMAND',club:'NORTHWIND TACTICAL',sub:'OPERATIONS CENTER / FIELD CONTROL',title:'READY THE CLUB.<br>OWN THE FIELD.',lead:'Оперативний штаб із жорсткою інформаційною ієрархією. Головне — стан команди, ресурси і наступний бій.',cta:'FIND A TARGET',tag:'STATUS / READY',stats:['12 / 14 READY','6,420 / 8,000 XP','740 / 1,200 BB'],cards:['MISSION READINESS','DEFENSE PROTOCOL']},b:{logo:'AIRSOFT<br>CLUBHOUSE',club:'IRON JACKALS',sub:'WAREHOUSE HQ / CLUB BAY',title:'BUILD A CREW.<br>MAKE A NAME.',lead:'Атмосфера живого клубу: бетон, дерево, метал, маркування ящиків і спорядження. Менше “системи”, більше місця та характеру.',cta:'OPEN THE FIELD BOARD',tag:'BAY 04 / OPEN',stats:['12 FIGHTERS ON SITE','LEVEL 8 / VETERAN','740 BASIC BB'],cards:['CLUB NOTICEBOARD','GEAR BENCH']},c:{logo:'AIRSOFT<br>RIVALS',club:'VANGUARD 4308',sub:'SOCIAL RANK / CLUB SEASON',title:'YOUR CLUB.<br>YOUR REPUTATION.',lead:'Сучасна соціальна rivalry-подача: суперники, прогрес і статус клубу виразніші; доступно й емоційно, але не мобільна F2P-гра.',cta:'CHALLENGE A CLUB',tag:'RANK #184',stats:['12 / 14 ACTIVE','SEASON XP 6,420','RATING 1,284'],cards:['DAILY MOMENTUM','RIVAL WATCH']}};
function render(id){const d=data[id],el=document.getElementById(id);el.innerHTML=`<div class="screen"><aside class="nav"><div class="logo">${d.logo}</div>${['CLUB','ROSTER','RECRUITMENT','TRAINING','ARMORY','AMMUNITION','OPPONENTS','HISTORY'].map((x,i)=>`<a class="${i==0?'on':''}">${x}</a>`).join('')}<small>LOCAL RELEASE CANDIDATE</small></aside><main><header class="top"><div class="clubname">${d.club}</div><div class="chip">MONEY<b style="color:#e1b768">12,460</b></div><div class="chip">CREDITS<b style="color:#70b5cd">84</b></div><div class="chip">ACTIVE BB<b>ADVANCED · 740</b></div></header><span class="tag">${d.tag}</span><section class="content"><div class="hero"><div class="eyebrow">${d.sub}</div><h1 class="title">${d.title}</h1><p class="lead">${d.lead}</p><button class="action">${d.cta}</button><img class="fighter" src="assets/fighter.png"></div><div class="stats">${d.stats.map((s,i)=>`<div class="card"><label>${['TEAM READINESS','CLUB PROGRESSION','SUPPLY / RATING'][i]}</label><strong>${s}</strong><div class="micro">Authoritative server state</div></div>`).join('')}</div><div class="bottom"><div class="card"><label>${d.cards[0]}</label><strong>${id==='c'?'STREAK 5 / 7':'NEXT ACTION'}</strong><div class="micro">Daily progress, recovery, achievements and Credits.</div></div><div class="card"><label>${d.cards[1]}</label><strong>${id==='b'?'LOADOUT CHECK':'SHIELD / OPEN'}</strong><div class="micro">Incoming protection, opponents and club status.</div></div></div></section><div class="palette"><i style="background:#0c1216"></i><i style="background:#d7b168"></i><i style="background:#d98039"></i><i style="background:#68afc7"></i></div></main></div><div class="desc"><b>${id==='a'?'A — Tactical Command':id==='b'?'B — Industrial Clubhouse':'C — Modern Social Rivalry'}</b> · Натисни вкладки зверху, щоб порівняти не лише кольори, а композицію, щільність і характер.</div>`}Object.keys(data).forEach(render);document.querySelectorAll('.switcher button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.switcher button,.concept').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.id).classList.add('active')})
</script></body></html>
